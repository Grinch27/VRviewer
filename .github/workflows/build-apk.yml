name: Android APK

# Requirements: follow awara's assemble-and-upload flow; no standalone test or lint stages.
# Open decisions/research: physical-device acceptance and stable signing remain separate milestones.
# Risks/verification: packaging success is not runtime acceptance; require APKs and SHA256 manifests.
# Reference: https://github.com/Grinch27/awara/blob/main/.github/workflows/build-apk.yml
# GitHub Actions workflow syntax reference:
# https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'NOTICE']
  workflow_dispatch:

run-name: VRviewer APK · ${{ github.ref_name }} · ${{ github.sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  build:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - APK build
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@main
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build APKs
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Prepare APK artifacts
        run: |
          set -euo pipefail
          install -D app/build/outputs/apk/debug/app-debug.apk build/delivery/debug/VRviewer-debug.apk
          install -D app/build/outputs/apk/release/app-release-unsigned.apk build/delivery/release/VRviewer-release-unsigned.apk
          (cd build/delivery/debug && sha256sum VRviewer-debug.apk > SHA256SUMS)
          (cd build/delivery/release && sha256sum VRviewer-release-unsigned.apk > SHA256SUMS)
      - name: Upload debug APK
        uses: actions/upload-artifact@main
        with:
          name: VRviewer-debug-${{ github.sha }}
          path: build/delivery/debug/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@main
        with:
          name: VRviewer-release-unsigned-${{ github.sha }}
          path: build/delivery/release/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
